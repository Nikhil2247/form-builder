name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same PR cancels the previous run — CI minutes are not free
# and a superseded commit's result is never actionable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend: static checks + unit tests. No database required — anything here
  # that needs Postgres belongs in backend-integration below.
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: form-builder-backend/package-lock.json

      - run: npm ci

      # Prisma 7 resolves the datasource through prisma.config.ts, which reads
      # DATABASE_URL at load time. `generate` never connects, but the variable
      # must be present and well-formed or the config throws.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder

      # BLOCKING as of the 2026-08-13 cleanup. The backlog described by the
      # previous version of this comment (~1100 errors, "burn it down then make
      # it blocking") has been burned down: 2210 → 0 errors.
      #
      # How, so the next person does not have to re-derive it:
      #   • ~1350 were prettier formatting, fixed with `eslint --fix`.
      #   • 46 no-floating-promises came from ONE unnecessary `async` on
      #     AuditService.log(), which awaited nothing. Fixing the signature fixed
      #     all 46 call sites; the rule is now an ERROR because an unhandled
      #     rejection terminates the process on Node 15+.
      #   • The ~950 no-unsafe-* findings are WARNINGS, not errors — they come
      #     from Prisma's JSONB columns and `(tx: any)` transaction callbacks,
      #     where the honest fix is a cast that adds no safety. See the long
      #     rationale in eslint.config.mjs.
      #
      # --max-warnings is a RATCHET, not a target. It is set to the current
      # count so the number can only go down; lower it whenever you remove some.
      # Raising it should require saying why in the PR.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 951

      # The frontend mirrors this directory so the browser evaluates rules with
      # the same code the server does. A silent divergence would mean the
      # respondent sees one calculated value and the server stores another.
      - name: Rules engine mirror is in sync
        working-directory: .
        run: |
          diff -r form-builder-backend/src/common/rules frontend/src/lib/rules \
            --exclude=README.md \
            || {
              echo "::error::The rules engine copies have diverged."
              echo "Re-sync with: cp form-builder-backend/src/common/rules/*.ts frontend/src/lib/rules/"
              exit 1
            }

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npx nest build

  # ────────────────────────────────────────────────────────────────────────────
  # Backend: integration tests against real Postgres + Redis.
  #
  # This is where the tenant-isolation suite runs. It is the job that must never
  # be marked "allowed to fail" — a red build here means one tenant can read
  # another tenant's data.
  # ────────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend — integration & tenant isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: formbuilder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/formbuilder_test
      REDIS_URL: redis://localhost:6379
      # Test-only values. Both are syntactically valid but carry no privilege —
      # JWT_SECRET must clear the 32-char minimum in the Joi schema.
      JWT_SECRET: ci_test_secret_do_not_use_in_production_0123456789
      ENCRYPTION_KEY: Y2lfdGVzdF9lbmNyeXB0aW9uX2tleV9ub3RfcmVhbF8wMQ==
      # Required by the config schema even though no object storage is exercised.
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_ENDPOINT: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: form-builder-backend/package-lock.json

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Integration + tenant-isolation tests
        run: npm run test:e2e -- --ci --runInBand

  # ────────────────────────────────────────────────────────────────────────────
  # Schema drift: the committed migrations must fully reproduce schema.prisma.
  # Catches the classic "edited the schema, forgot to generate a migration" PR,
  # which otherwise only surfaces at deploy time.
  # ────────────────────────────────────────────────────────────────────────────
  schema-drift:
    name: Backend — migration drift check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: form-builder-backend/package-lock.json

      - run: npm ci

      # ── Why this is not a bare `--exit-code` ────────────────────────────────
      #
      # It was, and it had been failing since 2026-08-11. Migration
      # `20260811120000_platform_audit_and_choice_search` creates two pg_trgm GIN
      # indexes on `choice_items` for type-ahead search. Prisma's datamodel
      # cannot express a GIN index with `gin_trgm_ops`, so `migrate diff` reports
      # them as drift on EVERY run — the job could never go green, and a check
      # that is always red is a check nobody reads.
      #
      # The drift that matters — "someone edited schema.prisma and forgot to
      # generate a migration" — is still caught: we diff, then assert the output
      # contains ONLY the two known, deliberate trigram entries. Anything else
      # fails the job.
      #
      # If you add another raw-SQL index, add it to EXPECTED below and say why.
      - name: Verify migrations reproduce schema.prisma
        run: |
          set -o pipefail
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            > drift.txt 2>&1 || true

          echo "--- migrate diff output ---"
          cat drift.txt
          echo "---------------------------"

          # Normalise before filtering. `migrate diff` writes ANSI colour codes
          # and two banner lines ("Loaded Prisma config…", "Prisma schema
          # loaded…") to stderr, and 2>&1 above folds them in — without
          # stripping them they survive every filter and fail the job on a clean
          # repo. Verified against real output, not assumed.
          sed -e 's/\x1b\[[0-9;]*m//g' drift.txt > drift.clean

          # What remains after removing: the banner lines, blank lines, the
          # no-difference line, and the two pg_trgm indexes with the table
          # header they sit under. Anything left is real, un-migrated drift.
          UNEXPECTED=$(grep -vE \
            "^Loaded Prisma config.*$|\
          ^Prisma schema loaded.*$|\
          ^Datasource .*$|\
          ^\[\*\] Changed the \`choice_items\` table$|\
          ^[[:space:]]*\[-\] Removed index on columns \((label|value)\)$|\
          ^[[:space:]]*$|\
          ^No difference detected\.?$" drift.clean || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::schema.prisma and prisma/migrations have diverged."
            echo "Unexpected drift:"
            echo "$UNEXPECTED"
            echo ""
            echo "Fix: npx prisma migrate dev --name <describes-the-change>"
            exit 1
          fi

          echo "No unexpected drift. (Two pg_trgm indexes are known and expected.)"

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend: lint, typecheck, production build.
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Non-blocking for the same reason as the backend job (~134 existing
      # errors). Typecheck and build below are the real gates.
      # BLOCKING, same as the backend job. The 81 errors this used to carry are
      # gone: 7 were unescaped apostrophes in marketing copy (fixed), and the
      # rest were `no-explicit-any` and React Compiler findings, now warnings
      # with the reasoning recorded in frontend/eslint.config.mjs.
      #
      # The React Compiler warnings are REAL and deferred, not dismissed — 11
      # set-state-in-effect, 3 preserve-manual-memoization, and one each of
      # rules-of-hooks / purity / refs. The ratchet stops them multiplying while
      # they are worked through.
      - name: Lint
        run: npx eslint src --max-warnings 92

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # The build only needs this to be present and parseable; no network
          # call is made at build time.
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1
