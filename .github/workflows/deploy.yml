name: Deploy to VPS

# Modelled on the placeintern deploy pipeline and targeting the same VPS, with
# four differences that are NOT cosmetic — read them before editing:
#
#   1. THREE PM2 processes, not two. This backend runs a separate queue worker
#      (`PROCESS_ROLE=worker node dist/worker`). If it is not deployed, the API
#      still answers and submissions still return 202 — they just never get
#      processed. That is the worst failure shape available here, because
#      nothing is obviously broken.
#   2. The frontend is Next.js, not Vite. It is a SERVER, started with
#      `next start`; there is no static `dist/` to hand to `serve`.
#   3. Migrations must be able to FAIL the deploy. The reference pipeline ends
#      its migrate step with `|| echo "Migration skipped"`, which turns a failed
#      migration into a green deploy running new code against an old schema.
#   4. Health checks hit `/v1/health/ready`, which now genuinely checks Postgres,
#      Redis, the queues and object storage — see common/health/.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: false
        type: boolean
      deploy_backend:
        description: 'Deploy backend (API + worker)'
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend'
        required: false
        default: true
        type: boolean
      run_migrations:
        description: 'Run prisma migrate deploy'
        required: false
        default: true
        type: boolean

# Two deploys running at once would race on `git reset --hard` in the same
# working tree and on `prisma migrate deploy` against the same database.
# Deliberately NOT cancel-in-progress: cancelling a deploy midway through a
# migration is how you get a half-applied schema.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/form-builder' }}
  BACKEND_DIR: form-builder-backend
  FRONTEND_DIR: frontend
  REPO_URL: 'github.com/${{ github.repository }}.git'

  # PM2 process names. Changing one of these orphans the running process under
  # its old name — the reload falls through to `pm2 start` and you end up with
  # two copies competing for the same port or queue.
  PM2_API: formbuilder-api
  PM2_WORKER: formbuilder-worker
  PM2_WEB: formbuilder-web

  API_PORT: ${{ vars.API_PORT || '3100' }}
  WEB_PORT: ${{ vars.WEB_PORT || '3000' }}

jobs:
  # ==========================================
  # DETECT CHANGES
  # ==========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'form-builder-backend/**'
            frontend:
              - 'frontend/**'
              # The rules engine is mirrored into the frontend and CI asserts the
              # copies match, so a backend-only rules change still means the
              # frontend bundle must be rebuilt.
              - 'form-builder-backend/src/common/rules/**'

  # ==========================================
  # BUILD + TEST BACKEND  (the gate)
  # ==========================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./form-builder-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./form-builder-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # prisma.config.ts reads DATABASE_URL at load time. `generate` never
      # connects, but the variable has to be present and well-formed.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 951

      - name: Unit tests
        if: ${{ !inputs.skip_tests }}
        run: npm test -- --ci --passWithNoTests
        env:
          NODE_ENV: test

      - name: Build application
        run: npx nest build

      # Both entrypoints must exist before we go anywhere near the server. A
      # missing dist/worker.js only shows up at `pm2 start`, by which point the
      # API has already been reloaded and the deploy is half-applied.
      - name: Verify both entrypoints were emitted
        run: |
          test -f dist/main.js   || { echo "::error::dist/main.js missing";   exit 1; }
          test -f dist/worker.js || { echo "::error::dist/worker.js missing"; exit 1; }
          echo "API and worker entrypoints present."

  # ==========================================
  # BUILD FRONTEND  (the gate)
  # ==========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src --max-warnings 92

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3100/v1' }}

  # ==========================================
  # DEPLOY BACKEND  (API + worker)
  # ==========================================
  # NOTE ON `always()` + `!= 'failure'`: the backend deploys on EVERY push to
  # main, including frontend-only ones, and that is deliberate. Both deploy jobs
  # `git reset --hard origin/main` in the SAME working tree, so a frontend-only
  # deploy already moves the backend's source files underneath it. Rebuilding
  # and reloading keeps `dist/` matching the source that is actually checked
  # out; skipping would leave the API running old build output against new
  # source, which is invisible until the next backend deploy produces a
  # confusing diff. `npm ci` + `nest build` on an unchanged tree is cheap.
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [changes, build-backend]
    if: |
      always() &&
      needs.build-backend.result != 'failure' &&
      needs.build-backend.result != 'cancelled' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_backend)
      )

    steps:
      - name: Deploy Backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "==> Syncing repository"
            cd ${{ env.DEPLOY_PATH }}
            git config user.email "github-actions@github.com"
            git config user.name  "GitHub Actions"
            git remote set-url origin https://x-access-token:${{ secrets.ACCESS_TOKEN }}@${{ env.REPO_URL }}
            git fetch origin main
            git reset --hard origin/main
            # -fd only. NOT -x: the server's .env files are gitignored and are
            # the deployment's actual configuration. `git clean -fdx` would
            # delete them and every subsequent boot would fail Joi validation.
            git clean -fd

            cd ${{ env.DEPLOY_PATH }}/${{ env.BACKEND_DIR }}

            echo "==> Installing dependencies"
            npm ci

            echo "==> Generating Prisma client"
            npx prisma generate

            # On a push, `inputs.run_migrations` is null, and GitHub's loose
            # equality makes `null == false` evaluate TRUE — so the obvious
            # `inputs.run_migrations == false` spelling would silently skip
            # migrations on every push. Anchor on the event type instead.
            if [ "${{ github.event_name != 'workflow_dispatch' || inputs.run_migrations }}" = "true" ]; then
              echo "==> Applying migrations"
              # NO `|| true` here, deliberately. A migration that fails and is
              # swallowed leaves new code running against an old schema, which
              # surfaces as scattered 500s rather than as a failed deploy.
              # `migrate deploy` only applies pending migrations and never resets.
              npx prisma migrate deploy
            else
              echo "==> Skipping migrations (requested)"
            fi

            echo "==> Building"
            npx nest build
            test -f dist/main.js
            test -f dist/worker.js

            # ── Worker first, then API ────────────────────────────────────────
            # Order matters. The worker is the consumer; the API is the producer.
            # Reloading the consumer first means that for the few seconds both
            # are mid-restart, jobs queue up in Redis rather than being consumed
            # by OLD worker code that may not understand a payload the NEW API
            # is about to start producing.
            #
            # kill-timeout 30s gives BullMQ time to finish in-flight jobs:
            # worker.ts wires SIGTERM/SIGINT to app.close(), which drains rather
            # than dropping them. Killing at PM2's 1.6s default would abandon
            # jobs mid-processing.
            echo "==> Reloading worker (${{ env.PM2_WORKER }})"
            pm2 reload ${{ env.PM2_WORKER }} --update-env 2>/dev/null || \
              PROCESS_ROLE=worker pm2 start dist/worker.js \
                --name ${{ env.PM2_WORKER }} \
                --kill-timeout 30000 \
                --time

            echo "==> Reloading API (${{ env.PM2_API }})"
            pm2 reload ${{ env.PM2_API }} --update-env 2>/dev/null || \
              PROCESS_ROLE=api pm2 start dist/main.js \
                --name ${{ env.PM2_API }} \
                --kill-timeout 10000 \
                --time

            echo "==> Waiting for readiness"
            # /v1/health/ready checks Postgres, Redis, the queues and object
            # storage. /v1/health/live is deliberately NOT used here: it answers
            # "the process is up" and would pass while the pod could not serve a
            # single request.
            MAX_RETRIES=12
            RETRY_COUNT=0
            until curl -sf "http://localhost:${{ env.API_PORT }}/v1/health/ready" > /dev/null 2>&1; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "::error::Readiness check failed after $MAX_RETRIES attempts."
                echo "--- readiness body (names the failing dependency) ---"
                curl -s "http://localhost:${{ env.API_PORT }}/v1/health/ready" || true
                echo
                echo "--- api logs ---"
                pm2 logs ${{ env.PM2_API }} --lines 80 --nostream || true
                echo "--- worker logs ---"
                pm2 logs ${{ env.PM2_WORKER }} --lines 40 --nostream || true
                exit 1
              fi
              echo "waiting for API readiness... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep 5
            done
            echo "Readiness OK."

            # The worker serves /metrics from its own bare listener on
            # METRICS_PORT (default 9464) because it has no HTTP server. This is
            # the only way to prove the worker actually came up — PM2 reporting
            # "online" only means the process exists.
            echo "==> Checking worker is alive"
            if curl -sf "http://localhost:${{ vars.METRICS_PORT || '9464' }}/metrics" > /dev/null 2>&1; then
              echo "Worker metrics endpoint responding."
            else
              echo "::warning::Worker metrics endpoint not responding on ${{ vars.METRICS_PORT || '9464' }}. \
            The worker may be down, or METRICS_PORT may differ. Check: pm2 logs ${{ env.PM2_WORKER }}"
              pm2 describe ${{ env.PM2_WORKER }} | grep -E "status|restarts" || true
            fi

            pm2 save
            echo "==> Backend deployment complete."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Backend deployment failed for ${{ github.sha }}."
          echo "The API and worker may be in a partially-reloaded state."
          echo "Check on the server: pm2 list && pm2 logs ${{ env.PM2_API }} --lines 100"

  # ==========================================
  # DEPLOY FRONTEND
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    # Sequenced AFTER the backend rather than in parallel: the frontend calls the
    # API, and this session's release adds routes it depends on (submission
    # detail, notifications stream, exports). Shipping the UI first would give
    # users a dashboard that 404s against the old API.
    needs: [changes, build-frontend, deploy-backend]
    if: |
      always() &&
      needs.build-frontend.result != 'failure' &&
      needs.build-frontend.result != 'cancelled' &&
      needs.deploy-backend.result != 'failure' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend)
      )

    steps:
      - name: Deploy Frontend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 20m
          script: |
            set -euo pipefail

            echo "==> Syncing repository"
            cd ${{ env.DEPLOY_PATH }}
            git config user.email "github-actions@github.com"
            git config user.name  "GitHub Actions"
            git remote set-url origin https://x-access-token:${{ secrets.ACCESS_TOKEN }}@${{ env.REPO_URL }}
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            cd ${{ env.DEPLOY_PATH }}/${{ env.FRONTEND_DIR }}

            echo "==> Installing dependencies"
            npm ci

            # ── Every NEXT_PUBLIC_* var is BAKED IN AT BUILD TIME ─────────────
            # They are substituted as literals during `next build`, not read at
            # runtime. Changing one therefore needs a rebuild, not a restart —
            # `pm2 restart --update-env` will appear to do nothing.
            echo "==> Building"
            NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3100/v1' }}" \
            NEXT_PUBLIC_SENTRY_DSN="${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}" \
            NEXT_PUBLIC_SENTRY_ENVIRONMENT="production" \
            NEXT_PUBLIC_STRICT_CSP_PUBLIC_ROUTES="${{ vars.NEXT_PUBLIC_STRICT_CSP_PUBLIC_ROUTES || '' }}" \
            NEXT_PUBLIC_UPGRADE_INSECURE_REQUESTS="${{ vars.NEXT_PUBLIC_UPGRADE_INSECURE_REQUESTS || '' }}" \
            NODE_ENV=production \
            npm run build

            # Next.js is a server, not a folder of static files. `next start`
            # serves the .next build — it cannot be replaced with `serve`,
            # because /f/[id] and /a/[slug] are dynamically rendered and the
            # nonce CSP is applied per request in src/proxy.ts.
            echo "==> Reloading web (${{ env.PM2_WEB }})"
            pm2 reload ${{ env.PM2_WEB }} --update-env 2>/dev/null || \
              pm2 start npm \
                --name ${{ env.PM2_WEB }} \
                --time \
                -- run start

            echo "==> Waiting for the site to answer"
            MAX_RETRIES=12
            RETRY_COUNT=0
            until curl -sf "http://localhost:${{ env.WEB_PORT }}/" > /dev/null 2>&1; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "::error::Frontend health check failed after $MAX_RETRIES attempts."
                pm2 logs ${{ env.PM2_WEB }} --lines 100 --nostream || true
                exit 1
              fi
              echo "waiting for frontend... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep 5
            done

            pm2 save
            echo "==> Frontend deployment complete."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Frontend deployment failed for ${{ github.sha }}."
          echo "Check on the server: pm2 logs ${{ env.PM2_WEB }} --lines 100"

  # ==========================================
  # DEPLOYMENT SUMMARY
  # ==========================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deployment Summary
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Backend (API + worker) | ${{ needs.deploy-backend.result }} |"
            echo "| Frontend | ${{ needs.deploy-frontend.result }} |"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Triggered by:** @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
