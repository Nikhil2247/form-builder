version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL Database (Primary Storage)
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: formbuilder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: formbuilder
    ports:
      - "5432:5432"
    volumes:
      - formbuilder_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d formbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # PgBouncer (Connection Pooling for Postgres)
  # ─────────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: formbuilder_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_NAME: formbuilder
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # Redis (Queues, Rate Limiting, API Key Cache)
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: formbuilder_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - formbuilder_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # MinIO (Local S3-compatible Storage for File Uploads)
  # ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: formbuilder_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      # S3 API port
      - "9000:9000"
      # Web Admin UI port
      - "9001:9001"
    volumes:
      - formbuilder_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # MinIO Setup (Automatically creates bucket & access keys)
  # ─────────────────────────────────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: formbuilder_minio_setup
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/formbuilder-uploads;
      /usr/bin/mc policy set private myminio/formbuilder-uploads;
      echo 'MinIO bucket setup complete.';
      "

  # ─────────────────────────────────────────────────────────────────
  # Backend API (NestJS)
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./form-builder-backend
      dockerfile: Dockerfile
    container_name: formbuilder_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@pgbouncer:5432/formbuilder?pgbouncer=true&connection_limit=5
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CORS_ORIGINS=http://localhost:3001
      - JWT_SECRET=c2297ebce59c1c01fffa488ef23d2400e9ec19782ceabf66fc1ff72d5351a6db
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  formbuilder_pg_data:
  formbuilder_redis_data:
  formbuilder_minio_data:
